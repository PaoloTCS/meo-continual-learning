seed: 42
device: auto
data: {root: ./data, num_tasks: 10, batch_size: 128, num_workers: 0}
model: {name: resnet50, pretrained: false, num_classes: 100}
training: {lr: 0.01, momentum: 0.9, weight_decay: 5e-4, epochs_per_task: 20}
method:
  type: ewc
  lambda_ewc: 0.03
  mode: online
  gamma: 0.9
  fisher_batches: 50
  fisher_batch_size: 64
